name: Revisione bozze con GPT-6 Luna

on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Valuta le bozze senza registrare esiti o scartarle'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: phonepulse-ai-draft-review
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verifica configurazione Luna
        id: config
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Revisione in attesa del secret OPENAI_API_KEY"
            if [ "$MANUAL_RUN" = true ]; then exit 1; fi
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.config.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - if: steps.config.outputs.ready == 'true'
        run: pip install -r scripts/requirements.txt
      - name: Valuta le bozze
        if: steps.config.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            python scripts/ai_draft_review.py --dry-run
          else
            python scripts/ai_draft_review.py
          fi
