name: Job A — Ricerca editoriale e preparazione bozze

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phonepulse-editorial-research
  cancel-in-progress: false

jobs:
  research:
    if: github.ref == 'refs/heads/master' && vars.PHONEPULSE_RESEARCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Prepara la ricerca per la revisione
        env:
          TOPICS: ${{ vars.PHONEPULSE_RESEARCH_TOPICS }}
        run: |
          mkdir -p "$RUNNER_TEMP/editorial-research"
          read -r -a topics <<< "$TOPICS"
          if (( ${#topics[@]} > 5 )); then
            echo 'Configurare al massimo cinque argomenti per esecuzione.' >&2
            exit 1
          fi
          for topic in "${topics[@]}"; do
            if [[ ! "$topic" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              echo 'Identificatore argomento non valido.' >&2
              exit 1
            fi
            input="docs/editorial/pilots/$topic-probe-input.json"
            if [[ ! -f "$input" ]]; then
              echo 'Argomento senza file di input nel repository.' >&2
              exit 1
            fi
            output="$RUNNER_TEMP/editorial-research/$topic"
            python scripts/editorial_dry_run.py --input "$input" --fetch --output "$output-manifest.json"
            python scripts/editorial_export.py --research-only --manifest "$output-manifest.json" --output "$output-admin-import.json"
          done
      - name: Conserva gli import per la redazione
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: editorial-research-review-only
          path: ${{ runner.temp }}/editorial-research/*.json
          if-no-files-found: ignore
          retention-days: 7
