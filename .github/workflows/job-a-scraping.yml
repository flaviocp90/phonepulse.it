name: Job A — Generazione gratuita bozze per review

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phonepulse-provider-writes
  cancel-in-progress: false

jobs:
  research:
    if: github.ref == 'refs/heads/master' && vars.PHONEPULSE_RESEARCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Installa dipendenze
        run: pip install -r scripts/requirements.txt
      - name: Genera e salva articoli come bozze da revisionare
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PHONEPULSE_EDITOR_AUTHOR: ${{ vars.PHONEPULSE_EDITOR_AUTHOR || 'Flavio Coppola' }}
        run: |
          python scripts/news_automation.py
