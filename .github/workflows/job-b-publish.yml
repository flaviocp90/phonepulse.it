name: Job B — Pubblicazione articolo del giorno

on:
  # Schedule intentionally disabled until staging and rollout checks pass.
  workflow_dispatch:

concurrency:
  group: phonepulse-approved-publishing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa dipendenze
        run: pip install -r scripts/requirements.txt
      - name: Pubblica articolo del giorno
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLISH_COUNT: '1'
        run: python scripts/publish_article.py
