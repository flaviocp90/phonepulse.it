name: Editorial evidence offline tests

on:
  pull_request:
    paths:
      - 'scripts/editorial_evidence.py'
      - 'scripts/editorial_retrieval.py'
      - 'scripts/editorial_dry_run.py'
      - 'tests/test_editorial_evidence.py'
      - 'tests/test_editorial_retrieval.py'
      - 'tests/test_editorial_dry_run.py'
      - 'docs/editorial/pilots/**'
      - '.github/workflows/editorial-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Offline editorial evidence and retrieval tests
        run: python -m unittest discover -s tests -p 'test_editorial_*.py' -v
