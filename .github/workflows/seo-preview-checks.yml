name: SEO preview safety checks

on:
  pull_request:
    paths:
      - 'api/seo-preview.js'
      - 'tests/seo-preview.test.mjs'
      - 'src/lib/publicEditorial.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/seo-preview-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test server HTML
        run: node --test tests/seo-preview.test.mjs
      - name: Build frontend
        run: npm run build
