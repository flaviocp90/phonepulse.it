name: Editorial live read-only probe

on:
  pull_request:
    paths:
      - 'scripts/editorial_retrieval.py'
      - 'scripts/editorial_live_probe.py'
      - '.github/workflows/editorial-live-probe.yml'

permissions:
  contents: read

concurrency:
  group: editorial-live-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  official-docs-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout unprivileged PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Read-only official documentation probe
        run: python scripts/editorial_live_probe.py
