name: Editorial live read-only probe

on:
  pull_request:
    paths:
      - 'scripts/editorial_retrieval.py'
      - 'scripts/editorial_live_probe.py'
      - '.github/workflows/editorial-live-probe.yml'
      - 'docs/editorial/pilots/*-probe-input.json'
      - 'scripts/editorial_export.py'
      - 'scripts/editorial_dry_run.py'

permissions:
  contents: read

concurrency:
  group: editorial-live-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  official-docs-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout unprivileged PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Read-only official documentation probe
        run: python scripts/editorial_live_probe.py
      - name: Three fixed read-only documentation cases
        run: |
          mkdir -p "$RUNNER_TEMP/editorial-research"
          for topic in health-connect photo-picker app-links; do
            python scripts/editorial_dry_run.py --input "docs/editorial/pilots/$topic-probe-input.json" --fetch --output "$RUNNER_TEMP/editorial-research/$topic-manifest.json"
            python scripts/editorial_export.py --research-only --manifest "$RUNNER_TEMP/editorial-research/$topic-manifest.json" --output "$RUNNER_TEMP/editorial-research/$topic-admin-import.json"
          done
      - name: Research files for manual review (no model or publication)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: editorial-research-review-only
          path: ${{ runner.temp }}/editorial-research/*.json
          retention-days: 7
