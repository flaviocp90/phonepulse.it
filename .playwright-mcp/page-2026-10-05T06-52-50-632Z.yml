    - heading "Chi siamo" [level=1] [ref=f5e29]
    - generic [ref=f5e31]:
      - paragraph [ref=f5e32]: "PhonePulse è un progetto editoriale italiano dedicato al mondo degli smartphone. Niente clickbait, niente pressioni pubblicitarie: solo analisi serie."
      - heading "La nostra missione" [level=2] [ref=f5e33]
      - paragraph [ref=f5e34]: Scegliere uno smartphone oggi è complicato. L'offerta è enorme, i prezzi cambiano in continuazione e le specifiche tecniche sono difficili da interpretare. PhonePulse nasce per semplificare questa scelta.
      - paragraph [ref=f5e35]: Ogni recensione è il risultato di un utilizzo reale e prolungato del dispositivo. Ogni comparativo mette a confronto prodotti sullo stesso piano. Ogni guida è scritta per chi non vuole perdere tempo.
      - heading "Indipendenza editoriale" [level=2] [ref=f5e36]
      - paragraph [ref=f5e37]: "I giudizi espressi su PhonePulse sono indipendenti. I link di affiliazione presenti in alcuni articoli non influenzano mai le valutazioni: un prodotto ottiene il voto che si merita, indipendentemente da chi lo vende o quanto costa."
      - heading "Il nostro metodo" [level=2] [ref=f5e38]
